<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Vikis Sweets Shop</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script type="text/javascript" src="https://cdns.us1.gigya.com/js/gigya.js?apiKey=4_4qEhi-moqNMXf6PUHjjw-g"></script>
</head>
<body>
    <header>
        <h1>Vikis Sweets Shop</h1>
    </header>
    <div id="container">
        <h2>Login or Register</h2>
        <div id="loginContainer">
            <p>Loading login options...</p>
        </div>
    </div>
    <script>
        const clientLoginConfig = {
            RP_SITE_API_KEY: '4_4qEhi-moqNMXf6PUHjjw-g',
            OP_PROVIDER_NAME: 'oidc-opopop'
        };
        const oidcButton = [{
            opName: clientLoginConfig.OP_PROVIDER_NAME,
            type: 'oidc',
            iconURL: '/images/chocolate_candy.jpg'
        }];

        // Check if user was logged out previously
        function checkLogoutState() {
            const wasLoggedOut = localStorage.getItem('loggedOut') === 'true';
            if (wasLoggedOut) {
                // User has been logged out, no need to check login status
                return false;
            }
            return true;
        }

        // Check login status first if not logged out
        function initializeLoginState() {
            if (!checkLogoutState()) {
                // User was logged out, don't try to auto-login
                return;
            }

            gigya.accounts.getAccountInfo({
                callback: function(response) {
                    if (response.errorCode === 0 && response.UID) {
                        // User is already logged in
                        handleLoginSuccess(response);
                    } else {
                        // User is not logged in, show login screen
                        showLoginScreen();
                    }
                }
            });
        }

        function showLoginScreen() {
            gigya.accounts.showScreenSet({
                screenSet: 'OIDC-RegistrationLogin',
                containerID: 'loginContainer',
                customButtons: oidcButton,
                sessionExpiration: -1,
                onError: function(eventObj) {
                    alert(`Login Error: ${eventObj.errorMessage || 'An unknown error occurred.'}`);
                }
            });
        }

        function handleLoginSuccess(response) {
            //document.contentWindow.postMessage(response, "*"); // Replace * with target origin if possible
            sessionStorage.setItem("response", JSON.stringify(response));
            window.location.href = 'catalog.html';
            // document.getElementById('container').style.display = 'none';
            // document.getElementById('loginContainer').style.display = 'none';
            // const name = response?.profile?.firstName || response?.profile?.nickname || 'User';
            // document.getElementById('welcome-message').textContent = `Welcome, ${name}! 🎉`;
            // document.getElementById('welcome-message').style.display = 'block';
            
            // // Show logout button
            // document.getElementById('logout-btn').style.display = 'inline-block';
            
            
            // catalog.style.display = 'block';
            
            // Clear logged out state
            // localStorage.removeItem('loggedOut');
        }

        // Initialize login state check
        initializeLoginState();

        // Add event handlers for login events
        gigya.accounts.addEventHandlers({
            onLogin: handleLoginSuccess
        });
    </script>
    </body>
</html>
