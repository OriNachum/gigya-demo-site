<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Vikis Sweets Shop</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script type="text/javascript" src="https://cdns.us1-st2.gigya.com/js/gigya.js?apiKey=4_4qEhi-moqNMXf6PUHjjw-g"></script>
</head>
<body>
    <header>
        <h1>Vikis Sweets Shop</h1>
    </header>
    <div id="container">
        <h2>Login or Register</h2>
        <div id="loginContainer">
            <p>Loading login options...</p>
        </div>
    </div>
    <script>
        async function showLoginScreen() {
            const response = await fetch('/api/client-config');
            const config = await response.json();
            const oidcButton = [{
                opName: config.opProviderName,
                type: 'oidc',
                iconURL: '/images/login_button.png'
            }];

            gigya.accounts.showScreenSet({
                screenSet: 'OIDC-RegistrationLogin',
                containerID: 'loginContainer',
                customButtons: oidcButton,
                sessionExpiration: 0,
                authFlow: "redirect",
                callback: function (response) {
                    console.log("Gigya Login Response:", response);
                    localStorage.removeItem('loggedOut');
                    if (response.errorCode === 0 && response.UID) {
                        handleLoginSuccess(response);
                    } else {
                        console.error("Login failed or user not logged in:", response);
                    }
                }
            });
        }

        //Workaround for the demo
        async function showLoginScreenNoIcon() {
            const response = await fetch('/api/client-config');
            const config = await response.json();
            const oidcButton = [{
                opName: config.opProviderName,
                type: 'oidc'
            }];

            gigya.accounts.showScreenSet({
                screenSet: 'OIDC-RegistrationLogin',
                containerID: 'loginContainer',
                customButtons: oidcButton,
                sessionExpiration: 0,
                authFlow: "redirect",
                onError: function (eventObj) {
                    alert(`Login Error: ${eventObj.errorMessage || 'An unknown error occurred.'}`);
                },
                callback: function (response) {
                    console.log("Gigya Login Response:", response);
                    localStorage.removeItem('loggedOut');
                    if (response.errorCode === 0 && response.UID) {
                        handleLoginSuccess(response);
                    } else {
                        console.error("Login failed or user not logged in:", response);
                    }
                }
            });
        }

        // Check if user was logged out previously
        function checkLogoutState() {
            const wasLoggedOut = localStorage.getItem('loggedOut') === 'true';
            if (wasLoggedOut) {
                // User has been logged out, no need to check login status
                return true;
            }
            return false;
        }

        // Check login status first if not logged out
        function initializeLoginState() {
            console.log("Initializing Gigya login state check...");
            if (checkLogoutState()) {
                localStorage.removeItem('loggedOut');
                console.log("User was logged out, showing login screen without icon.");
                // User was logged out, don't try to auto-login
                showLoginScreenNoIcon();
            } else {
                gigya.accounts.getAccountInfo({
                    callback: function (response) {
                        console.log(response.errorCode, response.UID, response.callId, JSON.stringify(response));
                        if (response.errorCode === 0 && response.UID) {
                            // User is already logged in
                            handleLoginSuccess(response);
                        } else {
                            // User is not logged in, show login screen
                            showLoginScreen();
                        }
                    }
                });
            }
        }

        function handleLoginSuccess(response) {
            //document.contentWindow.postMessage(response, "*"); // Replace * with target origin if possible
            console.log("Removing loggedOut")
            localStorage.removeItem('loggedOut');
            sessionStorage.setItem("response", JSON.stringify(response));
            window.location.href = 'catalog.html';
        }

        // Make initializeGigya globally available
        window.initializeGigya = function() {
            // Register the onLogin event handler (for login page)
            if (typeof gigya !== "undefined" && gigya.socialize && document.querySelector('.login-card')) {
                gigya.socialize.addEventHandlers({
                    onLogin: afterLogin
                });
            }

            // Define afterLogin only once
            async function afterLogin(loginResponseInfo) {
                localStorage.removeItem('loggedOut');
                sessionStorage.setItem("response", JSON.stringify(loginResponseInfo));
                console.log("Login Response:", loginResponseInfo);
                if (loginResponseInfo.errorCode > 0) {
                    alert("Your login attempt failed with error: " + loginResponseInfo.errorCode);
                    return;
                }
                var accountInfo = await getAccountInfo();
                console.log("Account Info:", accountInfo);
                if (accountInfo.errorCode === 0) {
                    window.location = `catalog.html`;
                }
            }
        }
        
        // Initialize login state check
        initializeLoginState();
        
    </script>
</body>
</html>
