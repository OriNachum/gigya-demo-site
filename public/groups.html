<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groups - Vikis Sweets Shop</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script type="text/javascript" src="https://cdns.us1-st2.gigya.com/js/gigya.js?apiKey=4_BBh5A7KRDVpfvcI23Dd1yg"></script>
</head>
<body>
<header>
    <h1>Vikis Sweets Shop</h1>
</header>
<h1>Select your sweet groups</h1>
<div id="groups-container">
</div>
<button id="continue-btn" class="continue-btn">Continue</button>

<script>
    function getAllMemberGroups() {
        try {
            const container = document.getElementById("groups-container");
            const loadingMessage = document.createElement("p");
            loadingMessage.textContent = "Loading groups...";
            loadingMessage.id = "loading-message"; // Add an ID for easy removal
            container.appendChild(loadingMessage);
            // Step 1: Get member groups
            gigya.accounts.groups.getAllMemberGroups({
                callback: function(groupsResponse) {
                    const loadingElement = document.getElementById("loading-message");
                    if (loadingElement) {
                        container.removeChild(loadingElement);
                    }
                    if (groupsResponse.errorCode === 0) {
                        console.log("Member Groups:", groupsResponse);
                        var groups = groupsResponse.results;
                        getContextData(groups)
                    } else {
                        console.error("Error fetching member groups:", groupsResponse.errorMessage);
                    }
                }
            });
        } catch (error) {
            console.error("Error in fetchGroupsAndContext:", error);
            return null;
        }
    }

    function getSelectedGroup(model) {
        var groupId;
        try {
            // Step 1: Get member groups
            gigya.accounts.session.groups.get({
                model: model,
                callback: function(sessionResponse) {
                    if (sessionResponse.errorCode === 0) {
                        console.log("Selected Groups:", sessionResponse);
                        if(sessionResponse.groupId)
                        {
                            groupId = sessionResponse.groupId;
                            console.log("No groups found for the selected model:", model);
                        }
                    } else {
                        console.error("Error fetching selected groups:", sessionResponse.errorMessage);
                    }
                }
            });
            return groupId;
        } catch (error) {
            console.error("Error in fetchGroupsAndContext:", error);
            return null;
        }
    }

    //             container.appendChild(groupDiv);
    //         });
    //     } else {

    //     }
    // }

    function getContextData(groups) {
        // Step 2: Get context data
        gigya.fidm.oidc.op.getContextData({
            callback: function(contextResponse) {
                shouldSkipGroupsSelection = true;
                if (contextResponse.errorCode === 0) {
                    console.log("Context Data:", contextResponse);
                    const mappedModels = contextResponse.memberships?.mapped_models || [];
                    console.log("Mapped Models:", mappedModels);
                    mappedModels.forEach(model => {
                        console.log("Mapped Model:", model);
                        var groupId = getSelectedGroup(model);
                        if(groupId!== undefined)
                        {
                            console.log("Group ID for model", model, ":", groupId);
                        } else {
                            // Create a dropdown for optional group IDs
                            const dropdown = document.createElement("select");
                            // Add a class to the dropdown for styling
                            dropdown.classList.add("styled-dropdown");
                            dropdown.id = `dropdown-${model}`;
                            console.log("Creating dropdown for model:", model);
                            
                            const defaultOption = document.createElement("option");
                            defaultOption.value = '';
                            defaultOption.textContent = `Select a group`;
                            dropdown.appendChild(defaultOption);

                            groups.forEach(group => {
                                if (group.model === model) {
                                    const option = document.createElement("option");
                                    option.value = group.groupId;
                                    option.textContent = `${group.groupId}`;
                                    dropdown.appendChild(option);
                                }
                            });

                            if (dropdown.options.length > 1) {
                                shouldSkipGroupsSelection = false
                                // Add a label above the dropdown
                                const label = document.createElement("label");
                                label.classList.add("dropdown-label");
                                label.htmlFor = dropdown.id;
                                label.textContent = `Please select a group in model ${model}: `;

                                // Append the label and dropdown to the container
                                const container = document.getElementById("groups-container");
                                const dropdownContainer = document.createElement("div");
                                dropdownContainer.style.marginBottom = "15px"; // Add spacing between dropdowns
                                dropdownContainer.appendChild(label);
                                dropdownContainer.appendChild(dropdown);
                                container.appendChild(dropdownContainer);
                                // Update selectedGroups object when a dropdown value changes
                                dropdown.addEventListener("change", (event) => {
                                    selectedGroups[model] = event.target.value; // Store the selected group ID for the model
                                    console.log("Updated selected groups:", selectedGroups);
                                });
                            } else {
                                console.log("No optional group IDs found for model", model);
                            }
                        }
                    });
                    
                } else {
                    console.error("Error fetching context data:", contextResponse.errorMessage);
                }
                if(shouldSkipGroupsSelection)
                {
                    redirectToProxy();
                }
                else
                {
                    setupContinueButton(); // Pass the updated value
                }
            }
        });
    }

    function setupContinueButton() {
        const continueBtn = document.getElementById("continue-btn");
        continueBtn.addEventListener("click", () => {
            console.log("Continue button click handler. selectedGroups:" + selectedGroups);
            // Iterate through selected models and groups
            Object.entries(selectedGroups).forEach(([model, groupId]) => {
                gigya.accounts.session.groups.set({
                    model: model,
                    groupId: groupId,
                    callback: function (response) {
                        if (response.errorCode === 0) {
                            console.log(`Session set for model: ${model}, group: ${groupId}`, response);
                        } else {
                            console.error(`Error setting session for model: ${model}, group: ${groupId}`, response);
                        }
                    }
                });
            });
            redirectToProxy();
        });
    }

    function redirectToProxy() {
        var url = gigya.utils.URL.addParamsToURL("proxy.html",{
            mode: 'afterGroups'
        });
        window.location.href = url;
    }
    
    function initializeGroupsSelection()
    {
        getAllMemberGroups();
    }
    const selectedGroups = {}; // Object to store selected models and group IDs
    // Initialize the flow
    initializeGroupsSelection();
    
</script>
</body>
</html>
