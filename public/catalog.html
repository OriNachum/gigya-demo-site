<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candies - Vikis Sweets Shop</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script type="text/javascript" src="https://cdns.us1-st2.gigya.com/js/gigya.js?apiKey=4_4qEhi-moqNMXf6PUHjjw-g"></script>
</head>
<body>
    <h2 id="welcome-message">Welcome!</h2>
    <div id="logout-container">
        <div id="group-info" class="group-info hidden">
            <p>You are logged in to group <span id="userGroup">XXX</span>.</p>
        </div>
        <button id="show-my-profile-btn" class="show-my-profile-btn">Show My Profile</button>
        <button id="hide-my-profile-btn" class="hide-my-profile-btn" >Hide My Profile</button>
        <button id="logout-btn" class="logout-btn">Logout</button>
    </div>
    <div id="user-profile"></div>
    <div class="container">
        <div id="regularCandies" class="candy-catalog">
            <h2>Regular Candies</h2>
            <div class="candy-grid"></div>
        </div>
        <div id="specialCandies" class="candy-catalog hidden">
            <h2>Club Member Specials!</h2>
            <div class="candy-grid"></div>
        </div>
        <div id="expertCandies" class="candy-catalog hidden">
            <h2>Club Member Expert!</h2>
            <div class="candy-grid"></div>
        </div>
    </div>
    <script>
        // Show welcome message
        window.addEventListener("message", (event) => {
            const userData = JSON.parse(sessionStorage.getItem("response"));
            console.log(JSON.stringify(userData));
            const name = userData?.profile?.firstName || userData?.profile?.nickname || 'User';
            document.getElementById('welcome-message').textContent = `Welcome, ${name}! 🎉`;
            document.getElementById('welcome-message').style.display = 'block';

            // Show group information
            const group = userData?.data.group_name || 'Unknown';
            const groupInfoDiv = document.getElementById('group-info');
            document.getElementById('userGroup').textContent = group;
            groupInfoDiv.classList.remove('hidden');
            
            // Show logout button
            document.getElementById('logout-btn').style.display = 'inline-block';
            
            showCandies(userData)
        });

        window.addEventListener("group_name_message", (event) => {
            const userData = JSON.parse(sessionStorage.getItem("response"));
            const name = userData?.profile?.firstName || userData?.profile?.nickname || 'User';
            const group = userData?.group || 'Unknown';

            document.getElementById('welcome-message').textContent = `Welcome, ${name}! 🎉`;
            document.getElementById('welcome-message').style.display = 'block';

            // Show group information
            const groupInfoDiv = document.getElementById('group-info');
            document.getElementById('userGroup').textContent = group;
            groupInfoDiv.classList.remove('hidden');

            // Show logout button
            document.getElementById('logout-btn').style.display = 'inline-block';

            showCandies(userData);
        });

        const showProfileBtn = document.getElementById("show-my-profile-btn");

        showProfileBtn.addEventListener("click", () => {
            const userData = JSON.parse(sessionStorage.getItem("response"));
            const name = userData?.profile?.firstName || userData?.profile?.nickname || 'Unknown';
            const gender = userData?.profile?.gender || 'Unknown';
            const memberLevel = userData?.data?.member_level || 'Unknown';
            const userProfileDiv = document.getElementById("user-profile");
            userProfileDiv.innerHTML = `
            <h2>👤 User Profile</h2>
            <strong>Name:</strong> ${name}<br>
            <strong>Gender:</strong> ${gender}<br>
            <strong>Level:</strong> ${memberLevel}
      `;
            userProfileDiv.style.display = "block";
            document.getElementById('show-my-profile-btn').style.display = 'none';
            document.getElementById('hide-my-profile-btn').style.display = 'inline-block';
        });

        const hideProfileBtn = document.getElementById("hide-my-profile-btn");

        hideProfileBtn.addEventListener("click", () => {
            const userProfileDiv = document.getElementById("user-profile");
            userProfileDiv.style.display = "none";
            document.getElementById('show-my-profile-btn').style.display = 'inline-block';
            document.getElementById('hide-my-profile-btn').style.display = 'none';
        });

        // Setup logout button click handler
        document.getElementById('logout-btn').addEventListener('click', function() {
            // Set logged out flag in localStorage
            console.log("Setting loggedOut")
            localStorage.setItem('loggedOut', 'true');
            sessionStorage.clear();
            
            // Call the server-side logout endpoint
            window.location.href = '/auth/logout';
        });

        async function showCandies(userData) {
            const response = await fetch('/api/candies');
            const allCandies = await response.json();
            const regularCandiesData = allCandies.filter(c => c.type === 'regular');
            displayCandies(regularCandiesData, 'regularCandies');
            const specialCandiesSection = document.getElementById('specialCandies');
            const expertCandiesSection = document.getElementById('expertCandies');
            if (userData?.data?.member_level !== undefined) {
                const specialCandiesData = allCandies.filter(c => c.type === 'special_club');
                displayCandies(specialCandiesData, 'specialCandies');
                specialCandiesSection.classList.remove('hidden');
                if (userData?.data?.member_expert !== undefined && userData?.data?.member_expert[0] === 'True') {
                    const expertCandiesData = allCandies.filter(c => c.type === 'expert_club');
                    displayCandies(expertCandiesData, 'expertCandies');
                    expertCandiesSection.classList.remove('hidden');
                }
            } else {
                specialCandiesSection.classList.add('hidden');
                expertCandiesSection.classList.add('hidden');
            }
        }
        function displayCandies(candies, containerId) {
            const sectionContainer = document.getElementById(containerId);
            const gridContainer = sectionContainer.querySelector('.candy-grid');
            gridContainer.innerHTML = '';
            if (!candies || candies.length === 0) {
                gridContainer.innerHTML = '<p>No candies to show at the moment.</p>';
                return;
            }
            candies.forEach(candy => {
                const candyDiv = document.createElement('div');
                candyDiv.className = 'candy-item';
                candyDiv.innerHTML = `
                    <img src="${candy.imageUrl}" alt="${candy.name}">
                    <h4>${candy.name}</h4>
                    <p class="price">$${typeof candy.price === 'number' ? candy.price.toFixed(2) : 'N/A'}</p>
                    <p>${candy.description || ''}</p>
                `;
                gridContainer.appendChild(candyDiv);
            });
        }
    </script>
</body>
</html>
